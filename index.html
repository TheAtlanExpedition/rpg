<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Image Generations Arcade Games" />
    <title>AI Arcade - Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header-wrapper">
      <div class="header-container">
        <h1>Arcade Games</h1>
        <div class="brand-container">
          <a
            href="https://theatlanexpedition.github.io/Learning_HTML/index.html"
            aria-label="Visit homepage"
          >
            <button class="brand-button" type="button">
              <span>ICON</span>
            </button>
          </a>
        </div>
      </div>
    </header>
    <script src="html.js" defer></script>
    <main class="main">
      <section id="game" class="page">
        <div class="games-container">
          <!-- Vertical game buttons -->
          <div class="game-buttons">
            <button
              id="game1Button"
              type="button"
              class="game-select-btn game1-btn"
            >
              <img
                src="https://raw.githubusercontent.com/TheAtlanExpedition/rpg/72e4e4b492e32bd0e4a35f84ccc1c91b69e86a7d/assets/webpage/game-cartridge.svg"
              />
              <span class="btn-label">Game<br />1</span>
            </button>
            <button
              id="game2Button"
              type="button"
              class="game-select-btn game2-btn"
            >
              <img
                src="https://raw.githubusercontent.com/TheAtlanExpedition/rpg/72e4e4b492e32bd0e4a35f84ccc1c91b69e86a7d/assets/webpage/game-cartridge.svg"
              />
              <span class="btn-label">Game<br />2</span>
            </button>
            <button
              id="game3Button"
              type="button"
              class="game-select-btn game3-btn"
            >
              <img
                src="https://raw.githubusercontent.com/TheAtlanExpedition/rpg/72e4e4b492e32bd0e4a35f84ccc1c91b69e86a7d/assets/webpage/game-cartridge.svg"
              />
              <span class="btn-label">Game<br />3</span>
            </button>
          </div>

          <!-- ONE shared game window -->
          <div
            id="gameWindow"
            class="game-window powered-off"
            aria-live="polite"
          >
            <!-- Power button sits on the frame -->
            <button
              id="gamePowerButton"
              type="button"
              class="power-btn"
              aria-pressed="false"
              title="Power"
            >
              <span class="power-icon">⏻</span>
            </button>
            <button id="globalStopButton" class="menu-button stop-btn">
              <span>Eject Game</span>
            </button>

            <!-- Single screen area that switches content -->
            <div class="game-screen">
              <!-- Powered Off -->
              <div
                id="poweredOffScreen"
                class="screen-content powered-off-screen"
              >
                <p>Game Window Powered Off</p>
                <span>Select a game to power on</span>
              </div>
              <div
                id="staticScreen"
                class="screen-content static-screen"
                hidden
              >
                <div class="static-noise"></div>
                <p>INSERT COIN</p>
                <span>Select a Game to Play</span>
                <div class="game-info"></div>
              </div>
              <!-- Game 1 -->
              <div
                id="game1Container"
                class="screen-content game-container"
                hidden
              >
                <canvas id="gameCanvas" width="800" height="500"></canvas>
                <div class="game-info"></div>
              </div>

              <!-- Game 2 -->
              <div
                id="game2Container"
                class="screen-content game-container"
                hidden
              >
                <canvas id="gameCanvas2" width="800" height="640"></canvas>
                <div id="gameInfo" class="game-info"></div>
                <button
                  id="game2restartButton"
                  type="button"
                  style="display: none"
                >
                  Restart Game 2
                </button>
              </div>

              <!-- Game 3 -->
              <div
                id="game3Container"
                class="screen-content game-container"
                hidden
              >
                <canvas id="gameCanvas3" width="800" height="640"></canvas>
                <div id="game3Info" class="game-info"></div>
                <button
                  id="game3restartButton"
                  type="button"
                  style="display: none"
                >
                  Restart Game 3
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-container">
      <p>“COPYRIGHT INFO”</p>
    </footer>

    <!-- Load the game scripts first, then control engine -->
    <script type="module" src="game_1.js"></script>
    <script type="module" src="game_2.js"></script>
    <script type="module" src="game_3.js"></script>
  </body>
</html>
